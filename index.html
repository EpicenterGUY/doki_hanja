<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="한자 트레이너">
<meta name="format-detection" content="telephone=no">
<title>어문회 한자 올인원 트레이너</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1f2430; --line:#303746;
  --text:#f3f5f7; --muted:#9aa4b2; --accent:#f0b94a; --good:#62d49b;
  --bad:#ff7474; --info:#76b7ff; --chip:#252b36; --shadow:0 12px 34px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
body{padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}
button,input:not([type="checkbox"]):not([type="radio"]),select,textarea{-webkit-appearance:none;appearance:none;border-radius:10px}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:contain}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1180px;margin:auto;padding:18px}
.top{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand h1{font-size:clamp(22px,4vw,34px);margin:0 0 3px}
.brand p{margin:0;color:var(--muted);font-size:13px}
.status{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.badge{padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:var(--chip);font-size:12px;color:#dce2e8}
.badge.good{border-color:#2e6b50;color:#a4efc8}
.badge.hot{border-color:#795a1e;color:#ffd987}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:9px 13px;border-radius:11px;white-space:nowrap}
.tab.active{background:#2a2418;border-color:#72541f;color:#ffd781}
.simple-home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.simple-card{border:1px solid var(--line);background:#12161d;border-radius:14px;padding:15px;cursor:pointer;text-align:left;color:var(--text)}
.simple-card:hover{border-color:#80662f}.simple-card b{display:block;font-size:16px;margin-bottom:5px}.simple-card small{color:var(--muted);line-height:1.45}
.quick-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.quick-pill{border:1px solid var(--line);background:#171c24;color:var(--text);padding:8px 11px;border-radius:999px}
.compact-settings{border:1px solid var(--line);border-radius:12px;background:#11151b;margin-top:10px}
.compact-settings summary{cursor:pointer;padding:11px 13px;font-weight:800;color:#d8dee7}
.compact-settings>div{padding:0 13px 13px}
.solve-method{display:flex;gap:6px;margin-top:10px}
.solve-method button{flex:1}
.soft{color:var(--muted);font-size:12px;line-height:1.5}
.hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hub-card{padding:16px;border:1px solid var(--line);border-radius:13px;background:#12161d}
.hub-card b{display:block;font-size:17px;margin-bottom:5px}.hub-card p{margin:0 0 12px;color:var(--muted);font-size:13px}
@media(max-width:600px){.simple-home,.hub-grid{grid-template-columns:1fr}}

.grid{display:grid;grid-template-columns:310px 1fr;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.sidebar{padding:14px}
.content{padding:18px;min-height:640px}
.section-title{font-weight:800;margin:3px 0 10px}
.label{font-size:12px;color:var(--muted);margin:11px 0 5px}
select,input[type="number"],input[type="text"],textarea{
  width:100%;background:#101319;border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:10px 11px;outline:none
}
select:focus,input:focus,textarea:focus{border-color:#88703d}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.check{display:flex;align-items:center;gap:7px;background:var(--chip);border:1px solid var(--line);padding:8px;border-radius:9px;font-size:12px}
.check input[type="checkbox"]{
  -webkit-appearance:checkbox;
  appearance:auto;
  width:18px;
  height:18px;
  flex:0 0 18px;
  accent-color:#d6a33b;
  margin:0;
}
.check.selected{
  background:#332916;
  border-color:#9b7427;
  color:#ffe3a2;
  box-shadow:inset 0 0 0 1px rgba(240,185,74,.16);
}
.check.selected::after{
  content:"✓";
  margin-left:auto;
  font-weight:900;
  color:#ffd873;
}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 12px;border-radius:10px;font-weight:700}
.btn.primary{background:#6f5119;border-color:#997224;color:#fff0c7}
.btn.good{background:#1b4b37;border-color:#2e7454}
.btn.bad{background:#552929;border-color:#7f3939}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.card{border:1px solid var(--line);background:#12151b;border-radius:15px;padding:18px}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}
.big-hanja{font-family:"Noto Serif CJK KR","Batang","NanumMyeongjo",serif;font-size:clamp(74px,15vw,150px);line-height:1;text-align:center;min-width:180px}
.prompt{font-size:clamp(20px,3.6vw,34px);font-weight:800;line-height:1.45}
.sub{color:var(--muted);margin-top:8px}
.answer-row{display:flex;gap:8px;margin-top:14px}
.answer-row input{font-size:18px;padding:13px}
.answer-row .btn{min-width:92px}
.feedback{margin-top:12px;padding:12px;border-radius:10px;display:none}
.feedback.ok{display:block;background:#153a2b;border:1px solid #2f7657}
.feedback.no{display:block;background:#3d2020;border:1px solid #7d3f3f}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.meta .badge{background:#1a1f28}
.progress{height:9px;background:#0d0f13;border-radius:99px;overflow:hidden;margin:12px 0}
.progress>div{height:100%;background:linear-gradient(90deg,#d7a83d,#f4d17a);width:0%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{background:#11151b;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:21px}.kpi span{font-size:12px;color:var(--muted)}
.canvas-wrap{display:none;margin-top:14px}
canvas{background:#fff;border-radius:12px;width:100%;max-width:430px;aspect-ratio:1;border:1px solid #555;touch-action:none}
.canvas-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:#1b2028;z-index:1}
tr:last-child td{border-bottom:none}
.tag{font-size:11px;padding:3px 6px;border-radius:7px;background:#2a303a;color:#ccd4dd}
.hot1{background:#523c15;color:#ffdb83}.hot2{background:#61311a;color:#ffb08c}
.empty{padding:40px 15px;text-align:center;color:var(--muted)}
.inline{display:flex;gap:8px}.inline>*{flex:1}
hr{border:0;border-top:1px solid var(--line);margin:15px 0}
.modecards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.modecard{padding:12px;background:#12161d;border:1px solid var(--line);border-radius:12px}
.modecard b{display:block;margin-bottom:4px}.modecard small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#252b34;border:1px solid #47505f;padding:10px 14px;border-radius:10px;z-index:50;display:none}
.small{font-size:12px}.right{text-align:right}
.filebtn{display:block;text-align:center}
input[type=file]{display:none}
.result-list{display:grid;gap:8px}
.result-item{display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:#12161c;padding:10px;border-radius:10px}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.choice-btn{border:1px solid var(--line);background:#161b23;color:var(--text);padding:12px;border-radius:10px;text-align:left}
.choice-btn:hover{border-color:#80662f}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:12px 0}
.toolbar>div{min-width:130px;flex:1}
.drill-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,420px);gap:16px;align-items:start}
.drill-answer{font-family:"Noto Serif CJK KR","Batang","NanumMyeongjo",serif;font-size:68px;text-align:center;padding:12px}
.exam-nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.exam-dot{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#171c24;color:var(--muted)}
.word-write-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.word-char-box{background:#101319;border:1px solid var(--line);border-radius:12px;padding:9px;text-align:center}
.word-char-box canvas{width:100%;aspect-ratio:1;max-width:none}
.word-char-label{font-size:12px;color:var(--muted);margin-top:6px}
.remote-exam-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:7px;margin-top:12px}
.round-btn{border:1px solid var(--line);background:#171c24;color:var(--text);padding:10px 6px;border-radius:9px}
.round-btn:hover{border-color:#987326}.round-btn.built{border-color:#2f7657;color:#a9edcb;background:#13231c}.round-btn.cancelled{opacity:.45;text-decoration:line-through}
.pdf-frame{width:100%;height:min(67vh,760px);border:1px solid var(--line);border-radius:12px;background:#fff}
.remote-question{margin-top:12px;border:1px solid var(--line);background:#10141a;border-radius:13px;padding:14px}
.q-snippet{font-size:14px;line-height:1.65;color:#d7dde5;background:#161b22;border-radius:9px;padding:10px;margin:9px 0}
.remote-status{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#121820;color:var(--muted);font-size:13px}
.remote-status.ok{border-color:#2e7454;color:#a9edcb}.remote-status.bad{border-color:#794141;color:#ffb0b0}
.remote-nav{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;max-height:190px;overflow:auto;margin-top:10px}
.remote-nav button{padding:6px 2px;font-size:11px;border:1px solid var(--line);border-radius:6px;background:#171c24;color:var(--muted)}
.remote-nav button.current{background:#6f5119;color:white}.remote-nav button.done{border-color:#347453;color:#b9efd0}
@media(max-width:600px){.pdf-frame{height:58vh}.remote-nav{grid-template-columns:repeat(8,1fr)}}

.source-text{margin-top:12px;padding:12px 14px;border-left:3px solid var(--accent);background:#11161d;border-radius:8px;line-height:1.7}
.source-text b{color:#ffd781}

.exam-dot.done{border-color:#52755f;color:#a8e6bd}.exam-dot.current{background:#6f5119;color:#fff}
@media(max-width:820px){.drill-grid{grid-template-columns:1fr}.choice-grid{grid-template-columns:1fr}}

@media(max-width:820px){
  .app{padding:10px}.top{align-items:flex-start}.grid{grid-template-columns:1fr}.sidebar{order:1}.content{order:2;min-height:520px}
  .hero{grid-template-columns:1fr}.big-hanja{order:-1;min-width:0}.kpis{grid-template-columns:1fr 1fr}.modecards{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
  input:not([type="checkbox"]):not([type="radio"]),select,textarea,button{font-size:16px}
  .check{font-size:14px;min-height:48px}
  .actions,.checks{grid-template-columns:1fr 1fr}.content{padding:13px}.sidebar{padding:12px}
  .answer-row{flex-direction:column}.answer-row .btn{width:100%}.modecards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <h1>漢字 올인원 트레이너</h1>
      <p>한국어문회 · 8급 → 특급 · 훈음/독음/쓰기/응용/기출빈도/오답 · iPhone/iPad 지원</p>
    </div>
    <div class="status">
      <span class="badge" id="dataBadge">배정한자 로딩 중</span>
      <span class="badge hot" id="freqBadge">기출 빈도 0건</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="practice">연습</button>
    <button class="tab" data-tab="exam">기출</button>
    <button class="tab" data-tab="drill">급수별</button>
    <button class="tab" data-tab="more">기록·설정</button>
  </div>

  <div class="grid">
    <aside class="panel sidebar">
      <div class="section-title">빠른 연습</div>
      <div class="label">목표 급수</div>
      <select id="level"></select>

      <div class="label">문제 수</div>
      <select id="count">
        <option value="10">10문제</option><option value="20" selected>20문제</option>
        <option value="50">50문제</option><option value="100">100문제</option><option value="0">무한</option>
      </select>

      <details class="compact-settings">
        <summary>유형·범위 설정</summary>
        <div>
          <div class="label">출제 범위</div>
          <select id="scope">
            <option value="all">배정한자 전체</option>
            <option value="freq">기출 빈출 우선</option>
            <option value="wrong">오답 위주</option>
            <option value="unseen">미풀이 위주</option>
          </select>

          <div class="label">기출 회차 필터</div>
          <div class="inline">
            <input id="roundFrom" type="number" value="30" min="1" title="시작 회차">
            <input id="roundTo" type="number" placeholder="최신" min="1" title="끝 회차">
          </div>

          <div class="label">문제 유형</div>
          <div class="checks" id="typeChecks"></div>
        </div>
      </details>

      <div class="actions">
        <button class="btn primary" id="startBtn">연습 시작</button>
        <button class="btn" id="randomBtn">랜덤 10</button>
      </div>
      <hr>
      <div class="note">
        <b>빈출 표시 방식</b><br>
        불러온 기출 데이터의 회차별 출현 횟수로 계산합니다. 기출 기록이 없는 글자는 임의로 빈출 처리하지 않습니다.
      </div>
    </aside>

    <main class="panel content">
      <section id="practice" class="tabpage"></section>
      <section id="exam" class="tabpage" hidden></section>
      <section id="drill" class="tabpage" hidden></section>
      <section id="more" class="tabpage" hidden></section>
      <section id="write" class="tabpage" hidden></section>
      <section id="freq" class="tabpage" hidden></section>
      <section id="wrong" class="tabpage" hidden></section>
      <section id="data" class="tabpage" hidden></section>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
"use strict";
const GRADE_ORDER=["8급","7급Ⅱ","7급","6급Ⅱ","6급","5급Ⅱ","5급","4급Ⅱ","4급","3급Ⅱ","3급","2급","1급","특급Ⅱ","특급"];
const TYPES={
  sound:"독음", meaning:"훈", meaningSound:"훈음", longSound:"장단음", write:"한자쓰기", wordWrite:"한자어쓰기", definition:"뜻풀이",
  radical:"부수", strokes:"총획", sameSound:"동음자",
  antonym:"반대·상대어", synonym:"동의·유의어", idiom:"사자성어",
  abbreviation:"약자", fill:"한자어 완성", homonym:"동음이의어", multiReading:"동자이음"
};
const GENERATED_TYPES=new Set(["sound","meaning","meaningSound","write","radical","strokes","sameSound","multiReading"]);
const RAW_URL="https://raw.githubusercontent.com/rycont/hanja-grade-dataset/main/hanja.csv";

let chars=[], examItems=[], session=[], current=0, sessionScore={ok:0,no:0}, mode="practice";
let examState={questions:[],index:0,answers:[],checked:[],score:0,round:null,level:null};
let drillState={list:[],index:0,mode:"meaningSound",order:"alpha",grade:"8급",checked:false};
let remoteExamState={round:null,url:null,pdf:null,questions:{},answers:{},types:{},pages:{},index:1,user:{},checked:{},score:0,loaded:false};
let freshSpecialUrls={};
const SPECIAL_CACHE_PREFIX="hanjaSpecialQuizV6_";
let specialBuildBusy=false;
const SPECIAL_ARCHIVE_URL="https://winteriscoming2u.tistory.com/38";

const GRADE_ARCHIVES={
  "8급":{post:37,label:"8급"},
  "7급Ⅱ":{post:36,label:"7급Ⅱ"},
  "7급":{post:35,label:"7급"},
  "6급Ⅱ":{post:34,label:"6급Ⅱ"},
  "6급":{post:33,label:"6급"},
  "5급Ⅱ":{post:32,label:"5급Ⅱ"},
  "5급":{post:31,label:"5급"},
  "4급Ⅱ":{post:30,label:"4급Ⅱ"},
  "4급":{post:29,label:"4급"},
  "3급Ⅱ":{post:28,label:"3급Ⅱ"},
  "3급":{post:27,label:"3급"},
  "2급":{post:26,label:"2급"},
  "1급":{post:25,label:"1급"},
  "특급Ⅱ":{post:39,label:"특급Ⅱ(준특급)"},
  "특급":{post:38,label:"특급"}
};
const ARCHIVE_LEVELS=["8급","7급Ⅱ","7급","6급Ⅱ","6급","5급Ⅱ","5급","4급Ⅱ","4급","3급Ⅱ","3급","2급","1급","특급Ⅱ","특급"];
const GRADE_ARCHIVE_CACHE_PREFIX="hanjaGradeArchiveV4_";
const GRADE_QUIZ_CACHE_PREFIX="hanjaGradeQuizV2_";
let examArchiveLevel="특급";
let gradeArchiveLinks={};
function isLocalContentMode(){
  const p=(location.protocol||"").toLowerCase();
  return p==="content:"||p==="file:";
}


const BUILTIN_GRADE_ROUNDS={
  "8급":[35,36,37,...Array.from({length:49},(_,i)=>39+i),...Array.from({length:25},(_,i)=>90+i)].filter(x=>x!==54&&x!==88&&x!==89),
  "7급Ⅱ":[...Array.from({length:53},(_,i)=>35+i),...Array.from({length:25},(_,i)=>90+i)],
  "7급":[...Array.from({length:53},(_,i)=>35+i),...Array.from({length:25},(_,i)=>90+i)],
  "6급Ⅱ":[...Array.from({length:53},(_,i)=>35+i),...Array.from({length:25},(_,i)=>90+i)],
  "6급":[...Array.from({length:53},(_,i)=>35+i),...Array.from({length:25},(_,i)=>90+i)],
  "5급Ⅱ":[...Array.from({length:53},(_,i)=>35+i),...Array.from({length:25},(_,i)=>90+i)],
  "5급":[...Array.from({length:53},(_,i)=>35+i),...Array.from({length:25},(_,i)=>90+i)],
  "4급Ⅱ":[...Array.from({length:53},(_,i)=>35+i),...Array.from({length:25},(_,i)=>90+i)],
  "4급":[...Array.from({length:53},(_,i)=>35+i),...Array.from({length:25},(_,i)=>90+i)],
  "3급Ⅱ":[...Array.from({length:53},(_,i)=>35+i),...Array.from({length:25},(_,i)=>90+i)],
  "3급":[...Array.from({length:53},(_,i)=>35+i),...Array.from({length:25},(_,i)=>90+i)],
  "2급":[...Array.from({length:53},(_,i)=>35+i),...Array.from({length:25},(_,i)=>90+i)],
  "1급":[...Array.from({length:53},(_,i)=>35+i),...Array.from({length:25},(_,i)=>90+i)],
  "특급Ⅱ":[...Array.from({length:50},(_,i)=>38+i),...Array.from({length:25},(_,i)=>90+i)],
  "특급":[...Array.from({length:50},(_,i)=>38+i),...Array.from({length:25},(_,i)=>90+i)]
};
function builtinRoundMap(level){
  const out={};
  for(const r of (BUILTIN_GRADE_ROUNDS[level]||[]))out[r]=null;
  return out;
}
async function fetchWithTimeout(url,options={},ms=4500){

function norm(s){return String(s??"").replace(/\s+/g,"").replace(/[·ㆍ]/g,"").trim().toLowerCase()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sample(a,n){return shuffle([...a]).slice(0,n)}
function gradeIndex(g){return GRADE_ORDER.indexOf(g)}
function gradeAllowed(g,target){return gradeIndex(g)>=0 && gradeIndex(g)<=gradeIndex(target)}
function parseMeaning(raw){
  try{
    const arr=JSON.parse(raw.split("'").join("\""));
    // 원본 형식: [[["마당"],["장"]], [["다른 훈"],["다른 음"]]]
    // 간혹 한 단계 더 감싸진 형태가 있으므로 정규화한다.
    const out=[];
    const walk=node=>{
      if(!Array.isArray(node))return;
      if(node.length>=2 && Array.isArray(node[0]) && Array.isArray(node[1])
         && node[0].every(x=>typeof x==="string") && node[1].every(x=>typeof x==="string")){
        out.push({meanings:node[0],sounds:node[1]});
        return;
      }
      node.forEach(walk);
    };
    walk(arr);
    return out;
  }catch(e){return []}
}
function parseCSV(text){
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i],n=text[i+1];
    if(q){
      if(c=='"'&&n=='"'){cell+='"';i++}
      else if(c=='"')q=false; else cell+=c;
    }else{
      if(c=='"')q=true;
      else if(c==","){row.push(cell);cell=""}
      else if(c=="\n"){row.push(cell.replace(/\r$/,""));rows.push(row);row=[];cell=""}
      else cell+=c;
    }
  }
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows;
}
function loadCharCSV(text){
  const rows=parseCSV(text), head=rows.shift();
  const ix=Object.fromEntries(head.map((h,i)=>[h,i]));
  const out=[];
  for(const r of rows){
    if(!r[ix.hanja]) continue;
    const meanings=parseMeaning(r[ix.meaning]||"[]");
    out.push({
      sound:r[ix.main_sound],level:r[ix.level],hanja:r[ix.hanja],
      meanings,radical:r[ix.radical],strokes:+r[ix.strokes],total:+r[ix.total_strokes]
    });
  }
  chars=out;
  localStorage.setItem("hanjaCharCacheV3",JSON.stringify({at:Date.now(),chars}));
  localStorage.removeItem("hanjaCharCache");
  $("#dataBadge").textContent=`배정한자 ${chars.length.toLocaleString()}자`;
  $("#dataBadge").classList.add("good");
  renderData();
}

function charPrimary(c){
  const m=c.meanings?.[0]||{meanings:[],sounds:[c.sound]};
  let meaning=Array.isArray(m.meanings)?(m.meanings[0]||""):String(m.meanings||"");
  let sound=Array.isArray(m.sounds)?(m.sounds[0]||c.sound):String(m.sounds||c.sound);
  // 잘못 파싱된 캐시/데이터에서 훈과 음이 같아지는 경우는 훈으로 쓰지 않는다.
  if(meaning===sound && c._rawMeaningHint) meaning=c._rawMeaningHint;
  return {meaning,sound};
}
function allMeaningSoundAnswers(c){
  const out=[];
  for(const m of (c.meanings||[])){
    const ms=Array.isArray(m.meanings)?m.meanings:[m.meanings].filter(Boolean);
    const ss=Array.isArray(m.sounds)?m.sounds:[m.sounds||c.sound].filter(Boolean);
    for(const mean of ms)for(const snd of ss){
      if(mean && snd)out.push(`${mean} ${snd}`);
    }
  }
  return [...new Set(out)];
}
function hideTargetHanja(text,hanja){
  let out=String(text??"");
  if(hanja) out=out.split(hanja).join("");
  // 괄호 안에 정답 한자가 단독/병기된 경우도 정리
  out=out.replace(/[\(（]\s*[一-龥豈-龎]\s*[\)）]/g,"");
  out=out.replace(/\s{2,}/g," ").trim();
  return out;
}
function safeClue(c){
  const p=charPrimary(c);
  return {meaning:hideTargetHanja(p.meaning,c.hanja),sound:p.sound};
}
function makeGeneratedQuestion(c,type){
  const p=charPrimary(c);
  let prompt="",answer="",display=c.hanja,note="";
  if(type==="sound"){prompt=`「${c.hanja}」의 음을 쓰세요.`;answer=[c.sound,...(c.meanings||[]).flatMap(x=>x.sounds||[])];}
  if(type==="meaning"){prompt=`「${c.hanja}」의 대표 훈을 쓰세요.`;answer=(c.meanings||[]).flatMap(x=>Array.isArray(x.meanings)?x.meanings:[x.meanings].filter(Boolean));note=`대표음: ${c.sound}`;}
  if(type==="meaningSound"){prompt=`「${c.hanja}」의 훈음을 쓰세요. (예: 집 가)`;answer=allMeaningSoundAnswers(c);note=`부수 ${c.radical} · ${c.total}획`;}
  if(type==="write"){const sp=safeClue(c);prompt=`${sp.meaning} ${sp.sound} — 알맞은 한자를 쓰세요.`;answer=c.hanja;display="✍";note="정답 한자는 힌트에서 숨김 처리됩니다.";}
  if(type==="radical"){prompt=`「${c.hanja}」의 부수를 쓰세요.`;answer=c.radical;}
  if(type==="strokes"){prompt=`「${c.hanja}」의 총획수를 숫자로 쓰세요.`;answer=String(c.total);note=`부수: ${c.radical}`;}
  if(type==="sameSound"){
    const pool=chars.filter(x=>x.sound===c.sound&&x.hanja!==c.hanja&&gradeAllowed(x.level,$("#level").value));
    const other=sample(pool,1)[0];
    if(!other) return null;
    prompt=`「${c.hanja}」와 같은 음(${c.sound})인 한자를 하나 쓰세요.`;
    answer=[other.hanja,...pool.slice(0,12).map(x=>x.hanja)];note="복수 정답 허용";
  }
  if(type==="multiReading"){
    const readings=[...new Set((c.meanings||[]).flatMap(x=>x.sounds||[]))];
    if(readings.length<2)return null;
    prompt=`「${c.hanja}」의 여러 음을 쉼표로 구분해 모두 쓰세요.`;
    answer=readings.sort().join(",");note="순서는 달라도 허용";
  }
  return {source:"generated",level:c.level,type,prompt,answer,hanja:c.hanja,display,note,radical:c.radical,total:c.total};
}
function freqCount(hanja){
  if(!hanja)return 0;
  const f=+$("#roundFrom").value||1,t=+$("#roundTo").value||Infinity;
  return examItems.filter(x=>x.round&&x.hanja===hanja&&x.round>=f&&x.round<=t).length;
}
function freqLabel(n,max){
  if(!n)return ["기출기록 없음",""];
  if(n===max&&max>=3)return [`🔥 최빈출 ${n}회`,"hot2"];
  if(n>=3)return [`★ 빈출 ${n}회`,"hot1"];
  if(n===2)return [`자주 ${n}회`,""];
  return [`출현 ${n}회`,""];
}
function buildPool(){
  const level=$("#level").value, types=selectedTypes();
  let pool=[];
  const allowed=chars.filter(c=>gradeAllowed(c.level,level));
  for(const type of types){
    if(GENERATED_TYPES.has(type)){
      for(const c of allowed){
        const q=makeGeneratedQuestion(c,type); if(q)pool.push(q);
      }
    }else{
      pool.push(...examItems.filter(x=>!x.frequencyOnly&&x.prompt&&x.answer!==undefined&&x.type===type&&gradeAllowed(x.level,level)&&inRangeRound(x)));
    }
  }
  const scope=$("#scope").value;
  if(scope==="wrong"){
    pool=pool.filter(q=>wrong[keyOf(q)]?.count>0);
  }else if(scope==="unseen"){
    pool=pool.filter(q=>!stats[keyOf(q)]);
  }else if(scope==="freq"){
    const withF=pool.filter(q=>freqCount(q.hanja)>0);
    if(withF.length) pool=withF.sort((a,b)=>freqCount(b.hanja)-freqCount(a.hanja));
  }
  return pool;
}
function keyOf(q){return `${q.type}|${q.hanja||""}|${q.prompt}`}

function answerList(q){
  if(Array.isArray(q.answer))return q.answer.map(String);
  return [String(q.answer??"")];
}
function flexibleAnswerVariants(a){
  a=String(a??"").trim();
  const out=new Set([norm(a)]);
  a.split(/[\/／,，]/).map(x=>x.trim()).filter(Boolean).forEach(x=>out.add(norm(x)));
  const circled={"①":"1","②":"2","③":"3","④":"4","⑤":"5","⑥":"6","⑦":"7","⑧":"8","⑨":"9","⑩":"10"};
  const cm=a.match(/^([①②③④⑤⑥⑦⑧⑨⑩])\s*(.*)$/);
  if(cm){out.add(circled[cm[1]]);out.add(norm(cm[1]));if(cm[2])out.add(norm(cm[2]))}
  const pm=a.match(/^(.*?)([\u3400-\u9fff\uf900-\ufaff])\(([\u3400-\u9fff\uf900-\ufaff])\)(.*)$/);
  if(pm){out.add(norm(pm[1]+pm[2]+pm[4]));out.add(norm(pm[1]+pm[3]+pm[4]))}
  return out;
}
function isCorrect(q,user){
  if(q.type==="multiReading"){
    const a=norm(q.answer).split(",").filter(Boolean).sort().join(",");
    const b=norm(user).split(",").filter(Boolean).sort().join(",");
    return a===b;
  }
  const u=norm(user);
  return answerList(q).some(a=>flexibleAnswerVariants(a).has(u));
}

function normalizeArchiveHref(href,base){

function parseArchiveHtml(html,base){

  [...doc.querySelectorAll("a[href]")].forEach(a=>{

    const m=txt.match(/(\d{2,3})회/);if(!m)return;
    const r=+m[1],h=normalizeArchiveHref(a.getAttribute("href"),base);

function parseArchiveMarkdown(txt){

  for(const m of txt.matchAll(rx)){

  }
  return links;
}

async function loadGradeArchive(level,{force=false,requireLinks=false}={}){
  const existing=gradeArchiveLinks[level]||{};
  if(!force&&Object.values(existing).some(Boolean))return existing;

  if(!force){
    try{
      const c=JSON.parse(localStorage.getItem(archiveCacheKey(level))||"null");
      if(c?.links&&Object.values(c.links).some(Boolean)){
        gradeArchiveLinks[level]={...builtinRoundMap(level),...c.links};
        return gradeArchiveLinks[level];
      }
    }catch{}
  }

  const url=archivePageUrl(level);
  if(!url)throw Error("급수별 자료실 주소가 없습니다.");
  let links={};

  try{
    const jina="https://r.jina.ai/"+url;
    const r=await fetchWithTimeout(jina,{cache:"no-store",headers:{"Accept":"text/plain"}},12000);
    if(r.ok)links={...links,...parseArchiveMarkdown(await r.text())};
  }catch{}

  if(!Object.values(links).some(Boolean)){
    try{
      const r=await fetchWithTimeout(url,{cache:"no-store"},3500);
      if(r.ok){
        const html=await r.text();
        links={...links,...parseArchiveHtml(html,url),...parseArchiveMarkdown(html)};
      }
    }catch{}
  }

  if(Math.max(0,...Object.keys(links).map(Number))<114){
    try{
      const proxy="https://api.allorigins.win/raw?url="+encodeURIComponent(url);
      const r=await fetchWithTimeout(proxy,{cache:"no-store"},5000);
      if(r.ok){
        const html=await r.text();
        links={...links,...parseArchiveHtml(html,url),...parseArchiveMarkdown(html)};
      }
    }catch{}
  }

  if(Object.values(links).some(Boolean)){
    gradeArchiveLinks[level]={...builtinRoundMap(level),...links};
    try{
      localStorage.setItem(archiveCacheKey(level),JSON.stringify({
        at:Date.now(),links,maxRound:Math.max(...Object.keys(links).map(Number))
      }));
    }catch{}
    return gradeArchiveLinks[level];
  }

  if(requireLinks)throw Error("기출 원문 링크를 가져오지 못했습니다. 잠시 후 다시 시도해 주세요.");
  gradeArchiveLinks[level]=builtinRoundMap(level);
  return gradeArchiveLinks[level];
}

function guessExamMetaFromFilename(name,defaultLevel){
  const t=String(name||"");
  const rm=t.match(/(\d{2,3})\s*회/);
  let level=defaultLevel||examArchiveLevel||"특급";
  const gradePatterns=[
    ["특급Ⅱ",/(?:특급\s*(?:Ⅱ|II|2)|준특급)/i],
    ["특급",/특급/i],
    ["1급",/(?:^|[^\d])1\s*급/],
    ["2급",/(?:^|[^\d])2\s*급/],
    ["3급Ⅱ",/3\s*급\s*(?:Ⅱ|II|2)/i],
    ["3급",/3\s*급/],
    ["4급Ⅱ",/4\s*급\s*(?:Ⅱ|II|2)/i],
    ["4급",/4\s*급/],
    ["5급Ⅱ",/5\s*급\s*(?:Ⅱ|II|2)/i],
    ["5급",/5\s*급/],
    ["6급Ⅱ",/6\s*급\s*(?:Ⅱ|II|2)/i],
    ["6급",/6\s*급/],
    ["7급Ⅱ",/7\s*급\s*(?:Ⅱ|II|2)/i],
    ["7급",/7\s*급/],
    ["8급",/8\s*급/]
  ];
  for(const [g,re] of gradePatterns){
    if(re.test(t)){level=g;break}
  }
  return {level,round:rm?+rm[1]:null};
}
async function importOneExamPdfSilent(level,round,file,statusEl){
  if(!window.pdfjsLib)throw Error("PDF 분석 모듈 로딩 실패");
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  const flat=await pdfToFlat(pdf,level,round,statusEl);
  const answerStart=flat.findIndex(x=>/제?\s*\d+회.*답안지|답안지\s*(?:\(|（)?1?(?:\)|）)?|번호\s*정답/.test(x.line));
  if(answerStart<0)throw Error("답안지 위치 인식 실패");

  const answers=parseAnswerRows(flat.slice(answerStart).map(x=>x.line),0);
  const got=Object.keys(answers).length;
  if(got<10)throw Error(`정답 ${got}개만 인식`);

  const items=problemizeFlatPdf(level,round,flat,answerStart,answers);
  if(items.length<10)throw Error("문항 번호 인식 실패");

  const generic=items.filter(isGenericExamPrompt).length;
  if(generic/items.length>0.20)throw Error(`문제 본문 인식 부족 (${items.length-generic}/${items.length})`);

  examItems=examItems.filter(x=>!(x.autoParsed&&x.level===level&&+x.round===+round));
  examItems.push(...items);
  saveGradeQuizCache(level,round,items);
  return {items:items.length,answers:got};
}
async function importMultipleExamPdfs(files,defaultLevel){
  const list=[...(files||[])];

  let ok=0,fail=0;
  const failed=[];
  for(let i=0;i<list.length;i++){
    const file=list[i];
    const meta=guessExamMetaFromFilename(file.name,defaultLevel);
    if(!meta.round){
      fail++;failed.push(`${file.name}: 회차를 파일명에서 못 찾음`);
      continue;
    }
    try{
      if(status){

        status.textContent=`${i+1}/${list.length} · ${gradeDisplay(meta.level)} 제${meta.round}회 처리 중…`;

      ok++;
    }catch(e){
      fail++;
      failed.push(`${file.name}: ${e.message||e}`);
    }
  }

  if(status){
    status.className="remote-status "+(fail?"bad":"ok");
    status.innerHTML=`완료 · 성공 ${ok}개 / 실패 ${fail}개${failed.length?`<br><span class="small">${esc(failed.slice(0,4).join(" · "))}${failed.length>4?" 외":""}</span>`:""}`;
  }

}

function markerRE(n){
  return new RegExp(
    "(?:"
    +"\\\\[\\\\s*"+n+"(?:\\\\s*;[^\\\\]]*)?\\\\s*\\\\]"
    +"|\\\\(\\\\s*"+n+"\\\\s*\\\\)"
    +"|【\\\\s*"+n+"\\\\s*】"
    +"|〔\\\\s*"+n+"\\\\s*〕"
    +"|(?:^|\\\\s)"+n+"\\\\s*[\\.．:)）]\\s*"
    +"|^\\\\s*"+n+"\\\\s+(?=[\\\\u3400-\\\\u9fff\\\\uf900-\\\\ufaff가-힣])"
    +")"
  );
}

function contextForQuestion(problemLines,n){
  const re=markerRE(n);
  let idx=problemLines.findIndex(x=>re.test(x.line));
  if(idx<0)return "";

  const chunks=[];
  for(let j=Math.max(0,idx-1);j<=Math.min(problemLines.length-1,idx+3);j++){
    const line=problemLines[j].line;
    if(j>idx){
      const nm=line.match(/(?:\[\s*(\d{1,3})(?:\s*;[^\]]*)?\s*\]|\(\s*(\d{1,3})\s*\)|【\s*(\d{1,3})\s*】|〔\s*(\d{1,3})\s*〕|^\s*(\d{1,3})\s*[\.．:)）]?\s+)/);
      const other=nm?+(nm[1]||nm[2]||nm[3]||nm[4]||nm[5]):0;
      if(other&&other!==n)break;
    }
    chunks.push(line);
  }
  return cleanExamText(chunks.join(" "));
}
function extractHanjaAfterMarker(ctx,n){
  const ps=[
    new RegExp("\\\\[\\\\s*"+n+"(?:\\\\s*;[^\\\\]]*)?\\\\s*\\\\]\\\\s*([\\\\u3400-\\\\u9fff\\\\uf900-\\\\ufaff]{1,20})"),
    new RegExp("\\\\(\\\\s*"+n+"\\\\s*\\\\)\\\\s*([\\\\u3400-\\\\u9fff\\\\uf900-\\\\ufaff]{1,20})"),
    new RegExp("【\\\\s*"+n+"\\\\s*】\\\\s*([\\\\u3400-\\\\u9fff\\\\uf900-\\\\ufaff]{1,20})"),
    new RegExp("〔\\\\s*"+n+"\\\\s*〕\\\\s*([\\\\u3400-\\\\u9fff\\\\uf900-\\\\ufaff]{1,20})"),
    new RegExp("(?:^|\\\\s)"+n+"\\\\s*[\\\\.．:)）]?\\\\s*([\\\\u3400-\\\\u9fff\\\\uf900-\\\\ufaff]{1,20})"),
    new RegExp("([\\\\u3400-\\\\u9fff\\\\uf900-\\\\ufaff]{1,20})\\\\s*\\\\(\\\\s*"+n+"\\\\s*\\\\)")
  ];
  for(const re of ps){const m=ctx.match(re);if(m)return m[1]}
  // 번호와 한자가 PDF에서 다른 text item으로 분리되었을 때
  const groups=[...ctx.matchAll(/[\\u3400-\\u9fff\\uf900-\\ufaff]{1,20}/g)].map(m=>m[0]);
  return groups.find(x=>x.length>=1&&!/^(?:問|答案|問題紙)$/.test(x))||"";
}
function extractKoreanBeforeMarker(ctx,n){
  const ps=[
    new RegExp("([가-힣]{1,24})\\s*\\[\\s*"+n+"(?:\\s*;[^\\]]*)?\\s*\\]"),
    new RegExp("([가-힣]{1,24})\\s*\\(\\s*"+n+"\\s*\\)"),
    new RegExp("\\(\\s*"+n+"\\s*\\)\\s*([가-힣]{1,24})"),
    new RegExp("(?:^|\\s)"+n+"\\s*[\\.．:)）]?\\s*([가-힣]{1,24})")
  ];
  for(const re of ps){const m=ctx.match(re);if(m)return m[1]}
  return "";
}
function headerRangesFromFlat(flat,answerStart){
  const ranges=[],seen=new Set();
  for(let i=0;i<answerStart;i++){
    const line=flat[i].line;
    const m=line.match(/(?:\[?\s*(?:問|문제)\s*)?(\d{1,3})\s*[-~－–]\s*(\d{1,3})(?:\s*\])?/);
    if(!m)continue;
    const a=+m[1],b=+m[2];if(a<1||b<a||b>250)continue;
    const k=a+"-"+b;if(seen.has(k))continue;seen.add(k);
    const desc=cleanExamText([(flat[i-1]?.line||""),line,(flat[i+1]?.line||""),(flat[i+2]?.line||"")].join(" "));
    ranges.push({a,b,type:classifyExamHeader(desc),desc});
  }
  return ranges;
}
function parseCircledChoices(ctx){
  const matches=[...ctx.matchAll(/([①②③④⑤⑥⑦⑧⑨⑩])\s*([^\s①②③④⑤⑥⑦⑧⑨⑩]+)/g)];
  return matches.map(m=>`${m[1]} ${m[2]}`);
}
function fallbackExamType(level,n){
  if(level==="특급"){
    if(n<=50)return "sound";
    if(n<=82)return "meaningSound";
    if(n<=92)return "longSound";
    if(n<=133)return "wordWrite";
    if(n<=143)return "synonym";
    if(n<=153)return "antonym";
    if(n<=156)return "abbreviation";
    if(n<=166)return "homonym";
    if(n<=176)return "definition";
    if(n<=186)return "radical";
    if(n<=200)return "idiom";
  }
  if(level==="특급Ⅱ"){
    // 특급Ⅱ도 상위급수 공통 구성에서 헤더 인식 실패 시 원문을 그대로 보여주되,
    // 확실한 범위를 임의로 단정하지 않는다.
    return "other";
  }
  return "other";
}
function isGenericExamPrompt(q){
  const p=String(q?.prompt||"");
  return !p || /^제?\s*회?\s*\d+번\s*문제$/.test(p) || /^제회\s*\d+번\s*문제$/.test(p);
}
function parsedRoundLooksBroken(items){
  if(!items?.length)return true;
  const bad=items.filter(q=>isGenericExamPrompt(q)).length;
  const other=items.filter(q=>q.type==="other").length;
  return bad/items.length>0.20 || other/items.length>0.65;
}

function buildProblemizedPrompt(n,type,ctx,answer){
  const han=extractHanjaAfterMarker(ctx,n);
  const ko=extractKoreanBeforeMarker(ctx,n);
  if(type==="sound"&&han)return {prompt:`「${han}」의 독음을 쓰세요.`,hanja:han,korean:""};
  if(type==="meaningSound"&&han)return {prompt:`「${han}」의 훈과 음을 쓰세요.`,hanja:han,korean:""};
  if(type==="wordWrite"&&ko)return {prompt:`「${ko}」를 한자로 쓰세요.`,hanja:"",korean:ko};
  if(type==="radical"&&han)return {prompt:`「${han}」의 부수를 쓰세요.`,hanja:han,korean:""};
  if(type==="abbreviation"&&han)return {prompt:`「${han}」의 약자를 쓰세요.`,hanja:han,korean:""};
  if(type==="definition"&&han)return {prompt:`「${han}」의 일반적인 뜻을 쓰세요.`,hanja:han,korean:""};
  if(type==="longSound"&&ctx)return {prompt:`장단음 문제: ${ctx}`,hanja:"",korean:""};
  if(type==="antonym"&&ctx)return {prompt:`반대·상대어 문제: ${ctx}`,hanja:han,korean:""};
  if(type==="synonym"&&ctx)return {prompt:`같거나 비슷한 뜻의 한자 문제: ${ctx}`,hanja:han,korean:""};
  if(type==="idiom"&&ctx)return {prompt:`성어 문제: ${ctx}`,hanja:han,korean:""};
  if(type==="homonym"&&ctx)return {prompt:`동음이의어 문제: ${ctx}`,hanja:han,korean:""};
  if(ctx)return {prompt:ctx,hanja:han,korean:ko};
  return {prompt:`${n}번 문제 원문을 인식하지 못했습니다. 이 회차를 다시 문제화해 주세요.`,hanja:"",korean:""};
}
function problemizeFlatPdf(level,round,flat,answerStart,answers){
  const problemLines=flat.slice(0,answerStart),ranges=headerRangesFromFlat(flat,answerStart);
  const nums=Object.keys(answers).map(Number).filter(Boolean);

  for(const x of problemLines){
    const re=/\[\s*(\d{1,3})(?:\s*;[^\]]*)?\s*\]|\(\s*(\d{1,3})\s*\)|【\s*(\d{1,3})\s*】|〔\s*(\d{1,3})\s*〕|^\s*(\d{1,3})\s*[\.．:)）]?\s+/g;
    for(const m of x.line.matchAll(re)){
      const n=+(m[1]||m[2]||m[3]||m[4]||m[5]);
      if(n>=1&&n<=250)nums.push(n);
    }
  }

  let maxQ=Math.max(0,...nums);
  if(level==="특급")maxQ=Math.max(maxQ,200);

  const out=[];
  for(let n=1;n<=maxQ;n++){
    const rg=ranges.find(r=>n>=r.a&&n<=r.b);
    let type=rg?.type||"other";
    if(type==="other")type=fallbackExamType(level,n);

    const ctx=contextForQuestion(problemLines,n);
    const ans=String(answers[n]??"").trim();
    const built=buildProblemizedPrompt(n,type,ctx,ans);

    const q={
      round,no:n,level,type,
      prompt:built.prompt,
      answer:ans||"자가확인",
      hanja:built.hanja||"",
      korean:built.korean||"",
      sourceText:ctx||"",
      note:`제${round}회 ${gradeDisplay(level)} 기출 자동 문제화`,
      autoParsed:true
    };
    if(!ans)q.manual=true;
    if(type==="longSound"){
      const ch=parseCircledChoices(ctx);
      if(ch.length>=2)q.choiceHint=ch;
    }
    out.push(q);
  }
  return out;
}

function pdfFetchCandidates(url){
  const u=encodeURIComponent(url);
  return [
    {label:"원문 서버",url},
    {label:"AllOrigins",url:"https://api.allorigins.win/raw?url="+u},
    {label:"CorsProxy",url:"https://corsproxy.io/?url="+u},
    {label:"CodeTabs",url:"https://api.codetabs.com/v1/proxy?quest="+u}
  ];
}
function looksLikePdf(buf){
  if(!buf||buf.byteLength<5)return false;
  const a=new Uint8Array(buf,0,Math.min(buf.byteLength,16));
  for(let i=0;i<=a.length-5;i++){
    if(a[i]===0x25&&a[i+1]===0x50&&a[i+2]===0x44&&a[i+3]===0x46&&a[i+4]===0x2d)return true;
  }
  return false;
}
async function fetchPdfBytesWithFallback(url,statusEl=null){
  const errs=[];
  for(const c of pdfFetchCandidates(url)){
    try{
      if(statusEl)statusEl.textContent=`PDF 연결 시도 중 · ${c.label}`;
      const r=await fetchWithTimeout(c.url,{cache:"no-store"},8000);
      if(!r.ok)throw Error(`HTTP ${r.status}`);
      const buf=await r.arrayBuffer();
      if(!looksLikePdf(buf))throw Error("PDF 형식 아님");
      return buf;
    }catch(e){
      errs.push(`${c.label}: ${e.message||e}`);
    }
  }
  throw Error("PDF 원문 서버와 변환 서버 모두 연결하지 못했습니다.");
}
async function pdfToFlat(pdf,level,round,statusEl=null){
  const flat=[];
  for(let pn=1;pn<=pdf.numPages;pn++){
    if(statusEl)statusEl.textContent=`${gradeDisplay(level)} 제${round}회 문제화 중 · ${pn}/${pdf.numPages}페이지`;
    const page=await pdf.getPage(pn);
    const tc=await page.getTextContent();
    const lines=pdfLineGroups(tc.items);
    lines.forEach(line=>flat.push({pn,line}));
  }
  return flat;
}
async function parseLocalExamPdfFile(level,round,file){
  if(!file){toast("PDF 파일을 선택하세요.");return}
  if(!window.pdfjsLib){toast("PDF 분석 모듈을 불러오지 못했습니다.");return}
  const status=$("#localPdfStatus");
  try{

    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
    const flat=await pdfToFlat(pdf,level,round,status);
    const answerStart=flat.findIndex(x=>/제?\s*\d+회.*답안지|답안지\s*(?:\(|（)?1?(?:\)|）)?|번호\s*정답/.test(x.line));
    if(answerStart<0)throw Error("답안지 위치를 찾지 못했습니다.");

    const answers=parseAnswerRows(flat.slice(answerStart).map(x=>x.line),0);
    const got=Object.keys(answers).length;
    if(got<10)throw Error(`정답 인식이 부족합니다 (${got}개).`);

    const items=problemizeFlatPdf(level,round,flat,answerStart,answers);
    if(items.length<10)throw Error("문제 번호를 충분히 인식하지 못했습니다.");

    const generic=items.filter(isGenericExamPrompt).length;
    if(generic/items.length>0.20){
      throw Error(`문제 본문을 충분히 읽지 못했습니다 (${items.length-generic}/${items.length}).`);
    }

    examItems=examItems.filter(x=>!(x.autoParsed&&x.level===level&&+x.round===+round));
    examItems.push(...items);
    saveGradeQuizCache(level,round,items);

    if(status){
      status.className="remote-status ok";
      status.textContent=`완료 · ${items.length}문항 · 문제 본문 ${items.length-generic}개 · 정답 ${got}개`;
    }
    setTimeout(()=>startGradeRoundDirect(level,round),220);
  }catch(e){
    if(status){status.className="remote-status bad";status.textContent=`문제화 실패 · ${e.message||e}`}
  }
}

function readerTextToFlat(text){
  const flat=[];
  let page=1;
  for(let raw of String(text||"").split(/\r?\n/)){
    let line=raw.trim();
    if(!line)continue;
    const pm=line.match(/^(?:#{1,6}\s*)?(?:Page|페이지)\s*(\d+)\b/i);
    if(pm){page=+pm[1]||page;continue}
    if(/^\|?\s*:?-{3,}/.test(line))continue;
    line=line.replace(/^#{1,6}\s*/,"")
      .replace(/\[([^\]]+)\]\([^)]*\)/g,"$1")
      .replace(/\*\*([^*]+)\*\*/g,"$1");
    if(line.includes("|")){
      const cells=line.split("|").map(x=>x.trim()).filter(Boolean);
      if(cells.length>=2)line=cells.join(" ");
    }
    line=line.replace(/^[•*+-]\s+/,"").replace(/\s+/g," ").trim();
    if(line)flat.push({pn:page,line});
  }
  return flat;
}
async function fetchPdfTextViaReader(url,statusEl=null){
  const readerUrl="https://r.jina.ai/"+url;
  if(statusEl)statusEl.textContent="PDF 텍스트 변환 서버 연결 중…";
  const r=await fetchWithTimeout(readerUrl,{
    cache:"no-store",
    headers:{"Accept":"text/plain"}
  },28000);
  if(!r.ok)throw Error("Reader HTTP "+r.status);
  const text=await r.text();
  if(!text||text.length<400)throw Error("PDF 변환 서버가 본문을 충분히 반환하지 않았습니다.");
  const flat=readerTextToFlat(text);
  if(flat.length<20)throw Error("PDF 본문 인식량이 부족합니다.");
  return flat;
}

async function extractRoundPdf(level,round,statusEl=null){
  if(!window.pdfjsLib)throw Error("PDF 분석 모듈을 불러오지 못했습니다.");

  let url=sourcePdfUrl(level,round);
  if(!url){
    if(statusEl)statusEl.textContent=gradeDisplay(level)+" 제"+round+"회 원문 주소 확인 중…";
    await loadGradeArchive(level,{force:true,requireLinks:true});
    url=sourcePdfUrl(level,round);
  }
  if(!url)throw Error("이 회차의 원문 PDF 주소를 찾지 못했습니다.");

  try{
    const flat=await fetchPdfTextViaReader(url,statusEl);
    if(flat.some(x=>/답안지|번호\s*정답/.test(x.line))){
      if(statusEl)statusEl.textContent="PDF 원문 변환 완료 · 문제 분석 중…";
      return flat;
    }
  }catch(firstReaderError){
    if(statusEl)statusEl.textContent="원문 링크 갱신 후 다시 시도 중…";
  }

  try{
    await loadGradeArchive(level,{force:true,requireLinks:true});
    const fresh=sourcePdfUrl(level,round);
    if(fresh&&fresh!==url){
      url=fresh;
      const flat=await fetchPdfTextViaReader(url,statusEl);
      if(flat.some(x=>/답안지|번호\s*정답/.test(x.line))){
        if(statusEl)statusEl.textContent="최신 원문 링크 확인 완료 · 문제 분석 중…";
        return flat;
      }
    }
  }catch(refreshError){}

  if(statusEl)statusEl.textContent="PDF 직접 연결 최종 시도 중…";
  const buf=await fetchPdfBytesWithFallback(url,statusEl);
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  return await pdfToFlat(pdf,level,round,statusEl);
}
async function buildGradeRound(level,round,{startAfter=true,quiet=false}={}){
  if(round===88||round===89)return [];
  if(level==="특급"&&round===38){
    if(startAfter)startGradeRoundDirect(level,round);
    return EMBEDDED_SPECIAL38;
  }

  let existing=availableExamQuestions().filter(x=>x.level===level&&+x.round===+round);
  if(existing.length&&parsedRoundLooksBroken(existing)){
    examItems=examItems.filter(x=>!(x.autoParsed&&x.level===level&&+x.round===+round));
    try{localStorage.removeItem(quizCacheKey(level,round))}catch{}
    existing=[];
  }
  if(existing.length>=40){
    if(startAfter)startGradeRoundDirect(level,round);
    return existing;
  }

  const cached=loadCachedGradeQuiz(level,round);
  if(cached?.length){
    if(startAfter)startGradeRoundDirect(level,round);
    return cached;
  }

  if(startAfter){
    $("#exam").innerHTML=`<div class="card">
      <div class="meta"><span class="badge hot">${esc(gradeDisplay(level))}</span><span class="badge">제${round}회</span></div>
      <div class="prompt" style="margin-top:10px">기출 문제화 중</div>

      <div class="sub" style="margin-top:10px">문제 번호·문제 한자·정답을 다시 연결합니다. 완료되면 타이핑 풀이로 넘어갑니다.</div>
      <div class="actions">
        <button class="btn" onclick="renderExam()">회차 목록</button>
        <a class="btn filebtn" href="${archivePageUrl(level)}" target="_blank" rel="noopener">원문 자료실</a>
      </div>
    </div>`;
  }

  const status=startAfter?$("#roundBuildStatus"):null;
  try{
    const flat=await extractRoundPdf(level,round,status);
    const answerStart=flat.findIndex(x=>/제?\s*\d+회.*답안지|답안지\s*(?:\(|（)?1?(?:\)|）)?|번호\s*정답/.test(x.line));
    if(answerStart<0)throw Error("답안지 위치를 찾지 못했습니다.");

    const answers=parseAnswerRows(flat.slice(answerStart).map(x=>x.line),0);
    const got=Object.keys(answers).length;
    if(got<10)throw Error(`정답 인식이 부족합니다 (${got}개).`);

    const items=problemizeFlatPdf(level,round,flat,answerStart,answers);
    if(items.length<10)throw Error("문제 번호 인식이 부족합니다.");

    const generic=items.filter(isGenericExamPrompt).length;
    if(generic/items.length>0.20){
      throw Error(`문제 본문 인식이 부족합니다 (${items.length-generic}/${items.length}). PDF 파일로 다시 시도해 주세요.`);
    }

    examItems=examItems.filter(x=>!(x.autoParsed&&x.level===level&&+x.round===+round));
    examItems.push(...items);
    saveGradeQuizCache(level,round,items);

    if(status){
      status.className="remote-status ok";
      status.textContent=`완료 · ${items.length}문항 · 문제 본문 ${items.length-generic}개 · 정답 ${got}개 인식`;
    }
    if(startAfter)setTimeout(()=>startGradeRoundDirect(level,round),160);
    return items;
  }catch(e){
    if(!quiet)toast(`${gradeDisplay(level)} 제${round}회 자동 문제화 실패`);
    if(startAfter)renderPdfFallback(level,round,e.message||String(e));
    throw e;
  }
}
function startGradeRoundDirect(level,round){

  if(!qs.length){toast("문제화된 문항이 없습니다.");return}
  examState={questions:qs,index:0,answers:Array(qs.length).fill(""),checked:Array(qs.length).fill(false),score:0,round:+round,level};renderExamQuestion();
}

function pdfLineGroups(items){
  const rows=[];
  const sorted=[...items].sort((a,b)=>{
    const dy=b.transform[5]-a.transform[5];
    return Math.abs(dy)>2.2?dy:a.transform[4]-b.transform[4];
  });
  for(const it of sorted){
    const y=it.transform[5],x=it.transform[4],str=(it.str||"").trim();
    if(!str)continue;
    let row=rows.find(r=>Math.abs(r.y-y)<2.2);
    if(!row){row={y,items:[]};rows.push(row)}
    row.items.push({x,str});
  }
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>r.items.sort((a,b)=>a.x-b.x).map(x=>x.str).join(" ").replace(/\s+/g," ").trim());
}
function classifyExamHeader(desc){
  const t=desc.replace(/\s+/g," ");
  if(/讀音|독음|읽는\s*소리/.test(t))return "sound";
  if(/訓.*音|훈.*음|뜻.*소리/.test(t))return "meaningSound";
  if(/長音|장음|첫.*음절.*길/.test(t))return "longSound";
  if(/部首|부수/.test(t))return "radical";
  if(/總劃|총획|획수/.test(t))return "strokes";
  if(/同音異義|동음이의/.test(t))return "homonym";
  if(/類義|同義|유의|동의|뜻이.*비슷/.test(t))return "synonym";
  if(/反對|相對|반대|상대|뜻이.*반대/.test(t))return "antonym";
  if(/四字|故事|成語|성어/.test(t))return "idiom";
  if(/略字|略字|약자/.test(t))return "abbreviation";
  if(/뜻.*쓰|뜻.*풀이|고유어/.test(t))return "definition";
  if(/한자.*쓰|漢字.*쓰|漢字語.*漢字|正字.*쓰/.test(t))return "wordWrite";
  if(/漢字.*찾아.*번호|한자.*찾아.*번호|알맞은.*漢字.*번호|알맞은.*한자.*번호/.test(t))return "wordWrite";
  return "other";
}
function parseAnswerRows(allLines,startIndex){
  const ans={}; let lastNums=[];
  for(let i=startIndex;i<allLines.length;i++){
    let line=allLines[i];
    if(/수험번호|주민등록|채점위원|감독위원|답안란|채점란|번호\s*정답|뒷면|사단법인|韓國語文會/.test(line))continue;
    const matches=[...line.matchAll(/(?:^|\s)(\d{1,3})\s+(.+?)(?=(?:\s+\d{1,3}\s+)|$)/g)];
    if(matches.length){
      lastNums=[];
      for(const m of matches){
        const n=+m[1]; if(n<1||n>200)continue;
        let a=m[2].trim().replace(/\s+(?:1검|2검).*$/,"").trim();
        if(!a||/^(?:검|득점|서명)$/.test(a))continue;
        ans[n]=a;lastNums.push(n);
      }
    }else if(lastNums.length===1 && line.length<70){
      // 긴 뜻풀이가 다음 줄로 이어지는 경우
      const n=lastNums[0];
      if(ans[n] && !/^\d/.test(line))ans[n]+=" "+line;
    }
  }
  return ans;
}

    if(answerStart<0)throw Error("답안지 영역을 찾지 못했습니다");

  }
}
function answerHasHanja(a){return /[\u3400-\u9fff\uf900-\ufaff]/.test(String(a||""))}
function primaryHanjaAnswer(a){
  const m=String(a||"").match(/[\u3400-\u9fff\uf900-\ufaff]+/g);
  return m?m.join(""):"";
}
function answerVariants(a){
  a=String(a||"").trim();
  const set=new Set([a]);
  a.split(/[\/,，]/).map(x=>x.trim()).filter(Boolean).forEach(x=>set.add(x));
  // 예: 激憤(忿) -> 激憤, 激忿
  const pm=a.match(/^(.*?)([\u3400-\u9fff\uf900-\ufaff])\(([\u3400-\u9fff\uf900-\ufaff])\)(.*)$/);
  if(pm){set.add(pm[1]+pm[2]+pm[4]);set.add(pm[1]+pm[3]+pm[4])}
  return [...set];
}
function remoteTextCorrect(user,ans){
  const u=norm(user);
  return answerVariants(ans).some(v=>norm(v)===u);
}

function startExam(){
  const round=+$("#examRound").value,level=$("#examLevel").value;
  let qs=availableExamQuestions().filter(x=>+x.round===round&&x.level===level);
  qs=[...qs].sort((a,b)=>(+a.no||+a.number||9999)-(+b.no||+b.number||9999));
  if(!qs.length){toast("이 회차/급수의 문제가 없습니다");return}
  examState={questions:qs,index:0,answers:Array(qs.length).fill(""),checked:Array(qs.length).fill(false),score:0,round,level};
  renderExamQuestion();
}
function normalizeChoices(q){
  if(Array.isArray(q.choices))return q.choices.map(String);
  if(typeof q.choices==="string"&&q.choices.trim())return q.choices.split("|").map(x=>x.trim()).filter(Boolean);
  return [];
}

    }else showExamFeedback(q,st.answers[st.index],isCorrect(q,st.answers[st.index]));

function getWordWriteAnswer(q){
  const a=Array.isArray(q.answer)?String(q.answer[0]||""):String(q.answer||"");
  return a.replace(/\s+/g,"");
}

  const ans=getWordWriteAnswer(q);
  const clue=q.korean||q.word||q.reading||"";
  return `
    ${clue?`<div class="drill-answer" style="font-family:inherit;font-size:34px">${esc(clue)}</div>`:""}

}
function setupWordWriteCanvases(q){
  const ans=[...getWordWriteAnswer(q)];
  ans.forEach((ch,i)=>setupAnyCanvas(`#wordCanvas${i}`));
  const ti=$("#wordTypeInput");
  if(ti){
    $("#checkWordType").onclick=()=>gradeTypedWordWrite(q);
    ti.onkeydown=e=>{if(e.key==="Enter")gradeTypedWordWrite(q)};
    ti.focus();
  }
  $("#clearWordWrite").onclick=()=>{
    ans.forEach((_,i)=>clearAnyCanvas(`#wordCanvas${i}`));
    const fb=$("#examFeedback");fb.className="feedback";fb.innerHTML="";
  };
  $("#revealWordWrite").onclick=()=>{
    const fb=$("#examFeedback");fb.className="feedback ok";
    fb.innerHTML=`정답: <span style="font-family:serif;font-size:34px">${esc(ans.join(""))}</span>`;
  };
  $("#checkWordWrite").onclick=()=>gradeWordWrite(q);
}
function gradeTypedWordWrite(q){
  const inp=$("#wordTypeInput"),v=(inp?.value||"").trim();
  if(!v){toast("정답 한자를 입력하세요.");return}
  const ok=flexibleAnswerVariants(q.answer).has(norm(v));
  const st=examState,idx=st.index;
  if(st.checked[idx]&&st.answers[idx]?.__wordWriteOk)st.score--;
  st.answers[idx]={__wordWriteOk:ok,text:v,mode:"typing"};
  st.checked[idx]=true;if(ok)st.score++;
  const k=keyOf(q);
  stats[k]=stats[k]||{ok:0,no:0,last:0,type:q.type,hanja:q.hanja,level:q.level,prompt:q.prompt};
  stats[k][ok?"ok":"no"]++;stats[k].last=Date.now();
  if(!ok){
    wrong[k]=wrong[k]||{count:0,streak:0,type:q.type,hanja:q.hanja,level:q.level,prompt:q.prompt,answer:q.answer};
    wrong[k].count++;wrong[k].streak=0;wrong[k].last=Date.now();
  }
  saveProgress();
  const fb=$("#examFeedback");fb.className="feedback "+(ok?"ok":"no");
  fb.innerHTML=ok?`정답입니다.`:`오답 · 정답: <b style="font-family:serif;font-size:28px">${esc(getWordWriteAnswer(q))}</b>`;
}
function findCharMeta(ch){
  return chars.find(c=>c.hanja===ch)||null;
}
function gradeWordWrite(q){
  const ans=[...getWordWriteAnswer(q)];
  if(!ans.length){toast("정답 데이터가 없습니다");return}
  const results=[];
  for(let i=0;i<ans.length;i++){
    const c=$(`#wordCanvas${i}`);
    const r=handwritingSimilarity(c,ans[i]);
    if(r.blank){toast(`${i+1}번째 칸을 먼저 써 주세요`);return}
    const meta=findCharMeta(ans[i]);
    const observed=c._strokeCount||0;
    const sf=strokeCountFactor(observed,meta?.total||0);
    const score=Math.round(r.score*sf);
    results.push({ch:ans[i],score,ok:score>=60,observed,expected:meta?.total||0});
  }
  const avg=Math.round(results.reduce((a,b)=>a+b.score,0)/results.length);
  const passCount=results.filter(x=>x.ok).length;
  const ok=passCount===results.length && avg>=62;

  const st=examState,idx=st.index,was=st.checked[idx];
  if(was){
    const prev=st.answers[idx];
    if(prev&&prev.__wordWriteOk)st.score--;
  }
  st.answers[idx]={__wordWriteOk:ok,text:ans.join(""),scores:results.map(x=>x.score)};
  st.checked[idx]=true;
  if(ok)st.score++;

  const k=keyOf(q);
  stats[k]=stats[k]||{ok:0,no:0,last:0,type:q.type,hanja:q.hanja,level:q.level,prompt:q.prompt};
  stats[k][ok?"ok":"no"]++;stats[k].last=Date.now();
  if(!ok){
    wrong[k]=wrong[k]||{count:0,streak:0,type:q.type,hanja:q.hanja,level:q.level,prompt:q.prompt,answer:q.answer};
    wrong[k].count++;wrong[k].streak=0;wrong[k].last=Date.now();
  }
  saveProgress();

  const fb=$("#examFeedback");fb.className="feedback "+(ok?"ok":"no");
  fb.innerHTML=`${ok?"정답 처리":"다시 확인"} · 전체 평균 <b>${avg}%</b><br>`+
    results.map((r,i)=>`${i+1}. <span style="font-family:serif;font-size:24px">${esc(r.ch)}</span> ${r.score}%${r.expected?` · ${r.observed}/${r.expected}획`:""}`).join("<br>")+
    `<br><span class="small">정답: ${esc(ans.join(""))}</span>`;
}

function gradeExamAnswer(val){
  const st=examState,q=st.questions[st.index],was=st.checked[st.index];
  if(!String(val).trim()){toast("답을 입력하세요");return}
  const ok=isCorrect(q,val);
  if(was){
    const prevOk=isCorrect(q,st.answers[st.index]); if(prevOk)st.score--;
  }
  st.answers[st.index]=val;st.checked[st.index]=true;if(ok)st.score++;
  const k=keyOf(q);
  stats[k]=stats[k]||{ok:0,no:0,last:0,type:q.type,hanja:q.hanja,level:q.level,prompt:q.prompt};
  stats[k][ok?"ok":"no"]++;stats[k].last=Date.now();
  if(!ok){wrong[k]=wrong[k]||{count:0,streak:0,type:q.type,hanja:q.hanja,level:q.level,prompt:q.prompt,answer:q.answer};wrong[k].count++;wrong[k].streak=0;wrong[k].last=Date.now()}
  saveProgress();showExamFeedback(q,val,ok);
}
function showExamFeedback(q,val,ok){
  const fb=$("#examFeedback");if(!fb)return;fb.className="feedback "+(ok?"ok":"no");
  fb.innerHTML=ok?`정답입니다. <b>${esc(answerList(q)[0])}</b>`:`오답 · 입력: <b>${esc(val)}</b> · 정답: <b>${esc(answerList(q).join(" / "))}</b>${q.note?`<br><span class="small">${esc(q.note)}</span>`:""}`;
}
function renderExamResult(){
  const st=examState,total=st.questions.length,answered=st.checked.filter(Boolean).length;
  const wrongRows=st.questions.map((q,i)=>({q,i,ok:st.checked[i]&&(q.type==="wordWrite"?!!st.answers[i]?.__wordWriteOk:isCorrect(q,st.answers[i]))})).filter(x=>!x.ok);
  const byType={};
  st.questions.forEach((q,i)=>{const a=byType[q.type]||(byType[q.type]={n:0,ok:0});a.n++;if(st.checked[i]&&(q.type==="wordWrite"?!!st.answers[i]?.__wordWriteOk:isCorrect(q,st.answers[i])))a.ok++});
  $("#exam").innerHTML=`<div class="card">
    <div class="prompt">제${st.round}회 ${esc(st.level)} 결과 · ${st.score}/${total} (${Math.round(st.score/total*100)}%)</div>
    <div class="sub">채점한 문항 ${answered}/${total}. 틀린 문제는 오답 노트에도 저장됩니다.</div>
    <div class="modecards" style="margin-top:14px">${Object.entries(byType).map(([t,a])=>`<div class="modecard"><b>${esc(TYPES[t]||t)}</b><small>${a.ok}/${a.n} · ${Math.round(a.ok/a.n*100)}%</small></div>`).join("")}</div>
    <div class="section-title" style="margin-top:18px">틀림 / 미채점</div>
    <div class="result-list">${wrongRows.length?wrongRows.map(x=>`<div class="result-item"><span>${x.i+1}. ${esc(x.q.prompt)}</span><b>${esc(answerList(x.q)[0])}</b></div>`).join(""):`<div class="empty">전부 맞았습니다.</div>`}</div>
    <div class="actions"><button class="btn primary" onclick="startExam()">다시 풀기</button><button class="btn" onclick="renderExam()">회차 선택</button></div>
  </div>`;
}

function startDrill(){
  drillState.grade=$("#drillGrade").value;drillState.mode=$("#drillMode").value;drillState.order=$("#drillOrder").value;
  let list=exactGradeChars(drillState.grade);
  list=drillState.order==="alpha"?koSortChars(list):shuffle([...list]);
  if(!list.length){toast("해당 급수 데이터가 없습니다");return}
  drillState.list=list;drillState.index=0;drillState.checked=false;renderDrillCard();
}
function drillQuestion(c){
  const p=charPrimary(c);
  if(drillState.mode==="meaningSound"){
    const answers=allMeaningSoundAnswers(c);
    return {prompt:`「${c.hanja}」의 훈음을 적으세요.`,display:c.hanja,answer:answers,note:`${c.radical}부 · ${c.total}획`};
  }
  const sp=safeClue(c);
  return {prompt:`「${sp.meaning} ${sp.sound}」에 해당하는 한자를 쓰세요.`,display:`${sp.meaning} ${sp.sound}`,answer:c.hanja,note:`${c.level} · ${c.total}획`};
}

function getInkBounds(canvas,threshold=150){
  const ctx=canvas.getContext("2d"),img=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  let minX=canvas.width,minY=canvas.height,maxX=-1,maxY=-1,count=0;
  for(let y=0;y<canvas.height;y++){
    for(let x=0;x<canvas.width;x++){
      const i=(y*canvas.width+x)*4;
      const lum=(img[i]+img[i+1]+img[i+2])/3;
      if(img[i+3]>30 && lum<threshold){
        if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;count++;
      }
    }
  }
  return count?{minX,minY,maxX,maxY,count}:null;
}
function normalizedInk(canvas,size=96){
  const b=getInkBounds(canvas);
  if(!b)return null;
  const w=b.maxX-b.minX+1,h=b.maxY-b.minY+1;
  if(w<10||h<10||b.count<80)return null;
  const pad=Math.max(w,h)*0.08;
  const sx=Math.max(0,b.minX-pad),sy=Math.max(0,b.minY-pad);
  const sw=Math.min(canvas.width-sx,w+pad*2),sh=Math.min(canvas.height-sy,h+pad*2);
  const tmp=document.createElement("canvas");tmp.width=size;tmp.height=size;
  const x=tmp.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,size,size);
  const scale=Math.min((size-8)/sw,(size-8)/sh);
  const dw=sw*scale,dh=sh*scale,dx=(size-dw)/2,dy=(size-dh)/2;
  x.drawImage(canvas,sx,sy,sw,sh,dx,dy,dw,dh);
  const d=x.getImageData(0,0,size,size).data,bin=new Uint8Array(size*size);
  let n=0;
  for(let i=0;i<size*size;i++){
    const j=i*4,lum=(d[j]+d[j+1]+d[j+2])/3;
    if(d[j+3]>30&&lum<175){bin[i]=1;n++}
  }
  return {bin,n,size};
}
function renderTargetInk(ch,font,size=96){
  const c=document.createElement("canvas");c.width=600;c.height=600;
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,600,600);
  x.fillStyle="#111";x.textAlign="center";x.textBaseline="middle";
  x.font=`500 440px ${font}`;
  x.fillText(ch,300,310);
  return normalizedInk(c,size);
}
function nearMatch(a,b,r=5){
  const size=a.size,aa=a.bin,bb=b.bin;
  let hit=0,total=0;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const idx=y*size+x;if(!aa[idx])continue;total++;
    let found=false;
    for(let yy=Math.max(0,y-r);yy<=Math.min(size-1,y+r)&&!found;yy++){
      for(let xx=Math.max(0,x-r);xx<=Math.min(size-1,x+r);xx++){
        if((xx-x)*(xx-x)+(yy-y)*(yy-y)>r*r)continue;
        if(bb[yy*size+xx]){found=true;break}
      }
    }
    if(found)hit++;
  }
  return total?hit/total:0;
}
function occupancyGrid(x,cells=8){
  const out=new Uint8Array(cells*cells),size=x.size;
  const cw=size/cells,ch=size/cells;
  for(let y=0;y<size;y++)for(let xx=0;xx<size;xx++){
    if(!x.bin[y*size+xx])continue;
    const gx=Math.min(cells-1,Math.floor(xx/cw)),gy=Math.min(cells-1,Math.floor(y/ch));
    out[gy*cells+gx]=1;
  }
  return out;
}
function gridSimilarity(a,b){
  const ga=occupancyGrid(a),gb=occupancyGrid(b);
  let inter=0,uni=0,na=0,nb=0;
  for(let i=0;i<ga.length;i++){
    if(ga[i])na++; if(gb[i])nb++;
    if(ga[i]&&gb[i])inter++;
    if(ga[i]||gb[i])uni++;
  }
  const iou=uni?inter/uni:0;
  const coverage=Math.min(na,nb)/Math.max(1,Math.max(na,nb));
  return {iou,coverage,userCells:na,targetCells:nb};
}
function projectionSimilarity(a,b){
  const size=a.size;
  const ar=new Float32Array(size),ac=new Float32Array(size),br=new Float32Array(size),bc=new Float32Array(size);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const i=y*size+x;
    if(a.bin[i]){ar[y]++;ac[x]++}
    if(b.bin[i]){br[y]++;bc[x]++}
  }
  const corr=(u,v)=>{
    let dot=0,uu=0,vv=0;
    for(let i=0;i<u.length;i++){dot+=u[i]*v[i];uu+=u[i]*u[i];vv+=v[i]*v[i]}
    return (uu&&vv)?dot/Math.sqrt(uu*vv):0;
  };
  return (corr(ar,br)+corr(ac,bc))/2;
}
function handwritingSimilarity(canvas,ch){
  const user=normalizedInk(canvas,96);
  if(!user)return {score:0,blank:true,details:{}};
  const fonts=['"Batang","Noto Serif CJK KR",serif','"Malgun Gothic","Noto Sans CJK KR",sans-serif','serif'];
  let best={score:0};
  for(const font of fonts){
    const target=renderTargetInk(ch,font,96);if(!target)continue;
    const forward=nearMatch(user,target,5);
    const backward=nearMatch(target,user,5);
    const density=Math.min(user.n,target.n)/Math.max(user.n,target.n);
    const grid=gridSimilarity(user,target);
    const projection=projectionSimilarity(user,target);

    // 양방향 커버리지를 강하게 요구해 "획 하나만 걸치기"를 방지
    const bidir=Math.sqrt(forward*backward);
    let score = bidir*.46 + grid.iou*.24 + grid.coverage*.12 + projection*.13 + density*.05;

    // 정답이 차지하는 영역보다 지나치게 적은 영역만 그린 경우 강한 감점
    if(grid.userCells < Math.max(2, grid.targetCells*.28)) score *= .48;
    else if(grid.userCells < grid.targetCells*.45) score *= .76;

    // 잉크량이 너무 적은 낙서는 막되, 손글씨 편차는 넓게 허용
    if(density < .16) score *= .55;
    else if(density < .30) score *= .82;

    score=Math.max(0,Math.min(1,score));
    if(score>best.score) best={score,forward,backward,density,grid,projection};
  }
  return {score:Math.round(best.score*100),blank:false,details:best};
}
function strokeCountFactor(observed,expected){
  if(!expected||expected<1||!observed)return 1;
  const ratio=Math.min(observed,expected)/Math.max(observed,expected);
  // 정확한 획수일 필요는 없지만 차이가 심하면 점수 상한을 낮춘다.
  if(ratio<.18)return .42;
  if(ratio<.30)return .58;
  if(ratio<.45)return .74;
  if(ratio<.60)return .90;
  return 1;
}
function autoGradeHandwriting(sel,ch,expectedStrokes,callback){
  const canvas=$(sel);if(!canvas)return;
  const r=handwritingSimilarity(canvas,ch);
  if(r.blank){toast("먼저 한자를 써 주세요");return}

  const observed=canvas._strokeCount||0;
  const sf=strokeCountFactor(observed,+expectedStrokes||0);
  const finalScore=Math.round(r.score*sf);

  let ok=false,label="";
  if(finalScore>=62){ok=true;label="전체 형태가 정답과 잘 맞습니다"}
  else if(finalScore>=46){ok=false;label="대체로 비슷하지만 한 번 더 확인해 보세요"}
  else{ok=false;label="정답 형태와 차이가 큽니다"}

  const strokeText=(expectedStrokes&&observed)
    ? ` · 그린 획 ${observed}회 / 기준 ${expectedStrokes}획`
    : "";
  callback(ok,finalScore,label+strokeText);
}

function bindCanvasDrawing(c,ctx,onStrokeStart){
  let drawing=false,last=null;
  const pos=e=>{
    const r=c.getBoundingClientRect();
    const src=e.touches?.[0]||e.changedTouches?.[0]||e;
    return [(src.clientX-r.left)*c.width/r.width,(src.clientY-r.top)*c.height/r.height];
  };
  const down=e=>{
    if(e.cancelable)e.preventDefault();
    drawing=true;
    if(onStrokeStart)onStrokeStart();
    last=pos(e);
    try{ if(e.pointerId!==undefined&&c.setPointerCapture)c.setPointerCapture(e.pointerId) }catch{}
  };
  const move=e=>{
    if(!drawing)return;
    if(e.cancelable)e.preventDefault();
    const p=pos(e);
    ctx.strokeStyle="#111";ctx.lineWidth=14;ctx.lineCap="round";ctx.lineJoin="round";
    ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p;
  };
  const up=e=>{
    if(e&&e.cancelable)e.preventDefault();
    drawing=false;last=null;
  };

  if(window.PointerEvent){
    c.addEventListener("pointerdown",down,{passive:false});
    c.addEventListener("pointermove",move,{passive:false});
    c.addEventListener("pointerup",up,{passive:false});
    c.addEventListener("pointercancel",up,{passive:false});
  }else{
    c.addEventListener("touchstart",down,{passive:false});
    c.addEventListener("touchmove",move,{passive:false});
    c.addEventListener("touchend",up,{passive:false});
    c.addEventListener("touchcancel",up,{passive:false});
    c.addEventListener("mousedown",down);
    window.addEventListener("mousemove",move);
    window.addEventListener("mouseup",up);
  }
}

function renderData(){
  if(!$("#data"))return;
  const counts={};for(const c of chars)counts[c.level]=(counts[c.level]||0)+1;
  $("#data").innerHTML=`
    <div class="card">
      <div class="prompt">데이터 관리</div>
      <div class="sub">배정한자 데이터와 기출문제 데이터를 분리했습니다. 배정한자는 온라인 공개 CSV를 자동 로드하고 브라우저에 캐시합니다.</div>
      <div class="note" style="margin-top:9px"><b>iPhone/iPad:</b> 파일 앱의 미리보기보다 Safari에서 여는 것을 권장합니다. 손글씨 입력은 손가락과 Apple Pencil 모두 지원하며, 홈 화면에 추가해 앱처럼 사용할 수 있습니다.</div>
      <div class="modecards" style="margin-top:14px">
        ${GRADE_ORDER.map(g=>`<div class="modecard"><b>${g}</b><small>${(counts[g]||0).toLocaleString()}자</small></div>`).join("")}
      </div>
      <hr>
      <div class="section-title">기출문제 가져오기</div>
      <div class="note" style="margin-bottom:9px">공식 문제지는 <a href="https://www.hanja.re.kr/khes/khPds/lstQst.asp" target="_blank" rel="noopener" style="color:var(--info)">한국어문회 기출자료실</a>에서 확인할 수 있습니다. 이 프로그램의 시험 모드는 구조화한 JSON/CSV를 불러와 대화형으로 채점합니다.</div>
      <div class="note">문제까지 넣는 JSON 예: <code>[{"round":30,"no":1,"level":"3급","type":"sound","prompt":"...","answer":"...","hanja":"漢","choices":[]}]</code><br>
      CSV 열: <code>round,no,level,type,prompt,answer,hanja,note,choices,korean,sourceText</code> · 객관식 choices는 <code>A|B|C|D</code>처럼 구분합니다.<br>
      한자어쓰기(type=<code>wordWrite</code>)는 <code>korean=학교, answer=學校</code>처럼 넣고, 실제 기출 원문은 <code>sourceText</code>에 넣습니다.<br>
      빈도만 넣을 때는 <code>round,level,type,hanja</code>만 있어도 됩니다. type 값: ${Object.keys(TYPES).join(", ")}</div>
      <div class="actions">
        <label class="btn filebtn">기출 JSON/CSV 불러오기<input id="examFile" type="file" accept=".json,.csv,text/csv,application/json"></label>
        <button class="btn" id="exportExam">기출 데이터 내보내기</button>
        <button class="btn" id="examTemplate">기출 CSV 템플릿</button>
        <label class="btn filebtn">배정한자 CSV 직접 불러오기<input id="charFile" type="file" accept=".csv,text/csv"></label>
        <button class="btn bad" id="clearExam">기출 기록 초기화</button>
      </div>
      <hr>
      <div class="section-title">현재 상태</div>
      <div class="note">훈음 표시는 원본의 <b>훈 + 음</b>으로 분리해 읽습니다. 예: <b>場 = 마당 장</b>, <b>章 = 글 장</b>, <b>丈 = 어른 장</b>.</div>
      <div class="note">배정한자 ${chars.length.toLocaleString()}자 · 기출/응용 ${examItems.length.toLocaleString()}문항 · 회차 정보 포함 ${examItems.filter(x=>x.round).length.toLocaleString()}문항</div>
    </div>`;
  $("#examFile").onchange=importExamFile;$("#charFile").onchange=importCharFile;
  $("#exportExam").onclick=()=>downloadJSON(examItems,"한자_기출데이터.json");
  $("#examTemplate").onclick=downloadExamTemplate;
  $("#clearExam").onclick=()=>{if(confirm("가져온 기출 데이터를 초기화할까요? 기본 응용문항만 남습니다.")){examItems=[...APP_ITEMS,...EMBEDDED_SPECIAL38];localStorage.removeItem("hanjaExamItems");updateFreqBadge();renderData();renderFreq();renderExam()}};
}
async function importCharFile(e){const f=e.target.files[0];if(!f)return;loadCharCSV(await f.text());toast("배정한자 CSV 로드 완료")}
async function importExamFile(e){
  const f=e.target.files[0];if(!f)return;const text=await f.text();let arr=[];
  try{
    if(f.name.toLowerCase().endsWith(".json"))arr=JSON.parse(text);
    else{
      const rows=parseCSV(text),h=rows.shift().map(x=>x.trim()),ix=Object.fromEntries(h.map((x,i)=>[x,i]));
      arr=rows.filter(r=>r.length>1).map(r=>({
        round:ix.round!==undefined?(+r[ix.round]||null):null,
        no:ix.no!==undefined?(+r[ix.no]||null):null,
        level:ix.level!==undefined?r[ix.level]:"",
        type:ix.type!==undefined?r[ix.type]:"",
        prompt:ix.prompt!==undefined?r[ix.prompt]:"",
        answer:ix.answer!==undefined?r[ix.answer]:"",
        hanja:ix.hanja!==undefined?r[ix.hanja]:"",
        note:ix.note!==undefined?(r[ix.note]||""):"",
        choices:ix.choices!==undefined?(r[ix.choices]||""):"",
        korean:ix.korean!==undefined?(r[ix.korean]||""):"",
        sourceText:ix.sourceText!==undefined?(r[ix.sourceText]||""):""
      }));
    }
    arr=arr.filter(x=>x&&x.level&&x.type&&x.hanja).map(x=>({
      ...x,round:x.round?+x.round:null,
      frequencyOnly:!(String(x.prompt||"").trim() && x.answer!==undefined && String(x.answer).trim()!=="")
    }));
    examItems=[...APP_ITEMS,...EMBEDDED_SPECIAL38,...arr];localStorage.setItem("hanjaExamItems",JSON.stringify(arr));updateFreqBadge();renderData();renderFreq();renderExam();toast(`${arr.length}문항 불러옴`);
  }catch(err){toast("파일 형식을 확인하세요")}
}
function updateFreqBadge(){
  const saved=localStorage.getItem("hanjaExamItems");if(saved){try{const a=JSON.parse(saved);examItems=[...APP_ITEMS,...EMBEDDED_SPECIAL38,...a]}catch{}}
  const n=examItems.filter(x=>x.round).length;$("#freqBadge").textContent=`기출 빈도 ${n.toLocaleString()}건`;
}
function downloadJSON(obj,name){
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json;charset=utf-8"}),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
autoLoad();
</script>
