plugins {
    id "com.android.application"
}

android {
    namespace "com.epicenterguy.dokihanja"
    compileSdk 35

    defaultConfig {
        // Fresh package ID so the rebuilt app is always treated as a clean install.
        applicationId "com.epicenterguy.dokihanja.mobile"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "0.3.0"
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
}
