name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "SDKMANAGER=$SDKMANAGER"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Persist Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: doki-hanja-debug-signing-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doki-hanja-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: Publish direct APK download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DOKI-Hanja.apk
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest               --title "DOKI 漢字 Android"               --notes "Android 앱입니다. 웹 UI와 기출 데이터는 앱 실행 시 최신 GitHub Pages 버전을 사용합니다."               --target "$GITHUB_SHA"               --latest
          fi
          gh release upload android-latest DOKI-Hanja.apk --clobber
