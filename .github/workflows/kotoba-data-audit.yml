name: Kotoba Bridge content QA

on:
  push:
    paths:
      - 'kotoba-bridge/**'
      - '.github/workflows/kotoba-data-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all JavaScript syntax
        run: |
          find kotoba-bridge -maxdepth 1 -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node --check kotoba-bridge/audit-data.cjs
      - name: Test vocabulary spelling, quizzes and saved-progress migration
        run: node kotoba-bridge/test-vocab-quality.cjs
      - name: Audit actual content data and offline assets
        run: |
          node kotoba-bridge/audit-data.cjs --json > kotoba-bridge-audit.json
          node kotoba-bridge/audit-data.cjs --missing > kotoba-bridge-missing.json
      - name: Publish summary in GitHub Actions
        if: success()
        run: |
          node -e '
            const s = require("./kotoba-bridge-audit.json");
            const lines = [
              "## Kotoba Bridge - actual loaded content",
              "",
              "Vocabulary: **" + s.vocab + "** | Grammar: **" + s.grammar + "** | Example coverage: **" + s.bilingualExamples + " / " + s.vocab + " (" + s.coveragePercent + "%)**",
              "",
              "| Stage | Words | Bilingual examples | Missing |",
              "|---|---:|---:|---:|",
              ...Object.entries(s.levels).map(([k,v]) => "| "+k+" | "+v.words+" | "+v.examples+" | "+v.missing+" |"),
              "",
              "V1.5 applied examples: core **"+(s.v15Core?.applied??"?")+"**, advanced **"+(s.v15Advanced?.applied??"?")+"**.",
              "V1.6 applied examples: **"+(s.v16Backfill?.applied??"?")+"**.",
              "V1.7 applied examples: L4 **"+(s.v17L4?.applied??"?")+"**, L5 **"+(s.v17L5?.applied??"?")+"**, L6 **"+(s.v17L6?.applied??"?")+"**.",
              "V1.8 applied examples: L4 **"+(s.v18L4?.applied??"?")+"**, L5 **"+(s.v18L5?.applied??"?")+"**, L6 **"+(s.v18L6?.applied??"?")+"**.",
              "V1.9 completion: L5 analysis **"+(s.v19L5Argument?.applied??"?")+"**, L5 language **"+(s.v19L5Language?.applied??"?")+"**, L6 diplomacy **"+(s.v19L6Diplomacy?.applied??"?")+"**, L6 science **"+(s.v19L6Science?.applied??"?")+"**, L6 society **"+(s.v19L6Social?.applied??"?")+"**.",
              "V1.10 visible spacing proposals applied: **"+(s.orthography?.applied??"?")+"**, merged duplicates: **"+(s.orthography?.merged?.length??"?")+"**.",
              "V1.11 homonym and sense reviews applied: **"+(s.senseReview?.applied??"?")+"**; unmatched: **"+(s.senseReview?.missing?.length??"?")+"**.",
              "Grade corrections: **"+(s.gradeReview?.applied??"?")+"** downward and **"+(s.gradePromotion?.applied??"?")+"** upward.",
              "Polysemy notes: **"+(s.polysemy?.applied??"?")+"**.",
              "V1.12 POS/sense review: **"+(s.posSenseReview?.applied??"?")+"** reviewed and **"+(s.posSenseReview?.addedWords?.length??"?")+"** new base word.",
              "V1.13 contrast reviews: **"+(s.lexicalContrastReview?.applied??"?")+"** entries, primary meaning corrections **"+(s.lexicalContrastReview?.overrides??"?")+"**, missing **"+(s.lexicalContrastReview?.missing?.length??"?")+"**.",
              "POS/base-form warnings: **"+s.lexicalWarnings.length+"**, spacing collisions: **"+s.normalizedCollisions.length+"**.",
              "V1.14 grade review: **"+(s.gradeAudit?.redistributedDown??"?")+"** downward, **"+(s.gradeAudit?.redistributedUp??"?")+"** upward, **"+(s.gradeAudit?.posMeaningChanges??"?")+"** POS/gloss corrections.",
              "Structural errors: **"+s.issues.length+"**."
            ];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join("\n")+"\n");
          '
      - name: Save audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-bridge-content-audit
          path: |
            kotoba-bridge-audit.json
            kotoba-bridge-missing.json
          if-no-files-found: ignore
