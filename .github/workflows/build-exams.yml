name: Build all Hanja exam data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_exams.py"
      - "scripts/validate_exams.js"
      - "index.html"
      - ".github/workflows/build-exams.yml"

permissions:
  contents: write

concurrency:
  group: build-all-hanja-exams
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extractor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pymupdf

      - name: Build static exam data
        run: python scripts/build_exams.py

      - name: Validate all generated exam data
        run: node scripts/validate_exams.js

      - name: Commit generated exam data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exams
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Generate all past exam data"
          # main may have advanced while the long extraction was running.
          git pull --rebase origin main
          git push origin HEAD:main
