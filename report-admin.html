<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>DOKI 漢字 · 오류 신고 수신함</title>
<style>
:root{color-scheme:dark;--bg:#071225;--card:#0f1d34;--line:#243958;--text:#eef5ff;--muted:#8fa5c5;--accent:#7568ff;--good:#86e4c8;--bad:#ff9ca7}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071225,#0a1628);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(1100px,calc(100% - 24px));margin:0 auto;padding:24px 0 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.top h1{font-size:20px;margin:0}.top p{margin:4px 0 0;color:var(--muted);font-size:12px}
.card{background:rgba(15,29,52,.95);border:1px solid var(--line);border-radius:18px;padding:16px}.login{max-width:460px;margin:10vh auto 0;display:grid;gap:10px}
label{display:grid;gap:5px;color:var(--muted);font-size:12px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:11px;background:#091629;color:var(--text);padding:10px 11px;outline:none}
textarea{min-height:92px;resize:vertical}.btn{border:1px solid var(--line);border-radius:11px;background:#142642;color:var(--text);padding:10px 12px;font-weight:800}.btn.primary{background:linear-gradient(135deg,#655dff,#8d61ff);border:0}.btn.ghost{background:transparent}.muted{color:var(--muted);font-size:12px;line-height:1.5}.bad{color:var(--bad)}.good{color:var(--good)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.toolbar select{width:auto;min-width:140px}.toolbar .spacer{flex:1}
.list{display:grid;gap:10px}.report{background:rgba(15,29,52,.95);border:1px solid var(--line);border-radius:16px;overflow:hidden}.report-head{display:flex;gap:12px;justify-content:space-between;padding:13px 14px;border-bottom:1px solid rgba(92,120,161,.22)}.report-title{min-width:0}.report-title b{display:block;font-size:15px}.report-title span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.pill{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:10px;color:#cdd9ee}.report-body{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;padding:14px}.section{padding:11px;border-radius:12px;background:#0a172a;border:1px solid rgba(86,116,159,.18)}.section+.section{margin-top:8px}.section h3{margin:0 0 7px;font-size:11px;color:#9fb2ce}.section p{margin:0;white-space:pre-wrap;font-size:12px;line-height:1.55}.meta{font-size:10px;color:var(--muted);line-height:1.55;word-break:break-word}.attachments{display:flex;flex-wrap:wrap;gap:6px}.attachments button{border:1px solid var(--line);border-radius:9px;background:#122641;color:#dfeaff;padding:7px 9px;font-size:10px}.admin-controls{display:grid;gap:8px}.admin-controls .row{display:grid;grid-template-columns:140px 1fr;gap:8px}.status{min-height:20px;margin-top:8px}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}
@media(max-width:760px){.report-body{grid-template-columns:1fr}.admin-controls .row{grid-template-columns:1fr}.top{align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>DOKI 漢字 · 개발자 오류 수신함</h1><p>이 페이지 주소 자체는 공개될 수 있지만 신고 데이터는 Supabase RLS로 관리자 계정만 읽을 수 있습니다.</p></div>
    <button class="btn ghost" id="logoutBtn" hidden>로그아웃</button>
  </div>

  <div id="loginCard" class="card login">
    <div><b>개발자 로그인</b><div class="muted" style="margin-top:4px">Supabase Authentication의 개발자 계정으로 로그인합니다.</div></div>
    <label>이메일<input id="email" type="email" autocomplete="username"></label>
    <label>비밀번호<input id="password" type="password" autocomplete="current-password"></label>
    <button class="btn primary" id="loginBtn">로그인</button>
    <div id="loginStatus" class="muted"></div>
  </div>

  <main id="inbox" hidden>
    <div class="toolbar">
      <select id="statusFilter"><option value="">전체 상태</option><option value="new">새 신고</option><option value="checking">확인 중</option><option value="fixed">수정 완료</option><option value="closed">종료</option></select>
      <button class="btn" id="reloadBtn">새로고침</button>
      <span class="spacer"></span>
      <span id="countLabel" class="muted"></span>
    </div>
    <div id="reportList" class="list"></div>
    <div id="globalStatus" class="muted status"></div>
  </main>
</div>

<script src="./report-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const cfg=window.DOKI_REPORT_CONFIG||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let client=null,reports=[];

function ready(){
  return /^https:\/\/.+\.supabase\.co$/i.test(String(cfg.supabaseUrl||""))&&String(cfg.supabaseAnonKey||"").length>40&&!!window.supabase?.createClient;
}
function getClient(){
  if(client)return client;
  if(!ready())return null;
  client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  return client;
}
function setLoginStatus(msg,cls="muted"){const e=$("#loginStatus");e.className=cls;e.textContent=msg}
async function verifyAdmin(){
  const c=getClient();if(!c)return false;
  const me=await c.from("report_admins").select("user_id").limit(1);
  return !me.error&&Array.isArray(me.data)&&me.data.length>0;
}
async function enterInbox(){
  const ok=await verifyAdmin();
  if(!ok){
    await getClient().auth.signOut();
    $("#loginCard").hidden=false;$("#inbox").hidden=true;$("#logoutBtn").hidden=true;
    setLoginStatus("이 계정은 report_admins에 등록된 개발자 계정이 아닙니다.","bad");
    return;
  }
  $("#loginCard").hidden=true;$("#inbox").hidden=false;$("#logoutBtn").hidden=false;
  await loadReports();
}
async function login(){
  const c=getClient();
  if(!c){setLoginStatus("report-config.js에 Supabase URL/anon key를 먼저 입력하세요.","bad");return}
  const email=$("#email").value.trim(),password=$("#password").value;
  if(!email||!password){setLoginStatus("이메일과 비밀번호를 입력하세요.","bad");return}
  setLoginStatus("로그인 중…");
  const r=await c.auth.signInWithPassword({email,password});
  if(r.error){setLoginStatus(r.error.message,"bad");return}
  await enterInbox();
}
function fmtDate(v){try{return new Intl.DateTimeFormat("ko-KR",{dateStyle:"medium",timeStyle:"short"}).format(new Date(v))}catch{return v||""}}
function statusName(v){return ({new:"새 신고",checking:"확인 중",fixed:"수정 완료",closed:"종료"})[v]||v||"새 신고"}
async function loadReports(){
  const c=getClient(),status=$("#statusFilter").value;
  $("#globalStatus").textContent="불러오는 중…";
  let q=c.from("bug_reports").select("*").order("created_at",{ascending:false}).limit(300);
  if(status)q=q.eq("status",status);
  const r=await q;
  if(r.error){$("#globalStatus").className="bad";$("#globalStatus").textContent=r.error.message;return}
  reports=r.data||[];$("#countLabel").textContent=reports.length+"건";$("#globalStatus").textContent="";
  renderReports();
}
function renderReports(){
  const box=$("#reportList");
  if(!reports.length){box.innerHTML='<div class="card empty">해당 상태의 신고가 없습니다.</div>';return}
  box.innerHTML=reports.map(r=>{
    const at=Array.isArray(r.attachment_paths)?r.attachment_paths:[];
    return '<article class="report" data-id="'+esc(r.id)+'">'+
      '<div class="report-head"><div class="report-title"><b>'+esc(r.title)+'</b><span>'+esc(r.category)+' · '+esc(fmtDate(r.created_at))+' · '+esc(String(r.id).slice(0,8))+'</span></div><span class="pill">'+esc(statusName(r.status))+'</span></div>'+
      '<div class="report-body"><div>'+
        '<div class="section"><h3>문제 설명</h3><p>'+esc(r.description)+'</p></div>'+
        (r.steps?'<div class="section"><h3>재현 방법</h3><p>'+esc(r.steps)+'</p></div>':'')+
        (r.expected?'<div class="section"><h3>기대한 동작</h3><p>'+esc(r.expected)+'</p></div>':'')+
        (r.contact?'<div class="section"><h3>연락처</h3><p>'+esc(r.contact)+'</p></div>':'')+
        '<div class="section"><h3>첨부파일</h3><div class="attachments">'+(at.length?at.map((a,i)=>'<button onclick="openAttachment(\''+esc(r.id)+'\','+i+')">'+esc(a.name||("첨부 "+(i+1)))+' · '+Math.round((+a.size||0)/1024)+'KB</button>').join(""):'<span class="muted">없음</span>')+'</div></div>'+
      '</div><div>'+
        '<div class="section"><h3>자동 환경 정보</h3><div class="meta">build: '+esc(r.app_build)+'<br>mode: '+esc(r.app_mode)+'<br>viewport: '+esc(r.viewport)+'<br>URL: '+esc(r.page_url)+'<br>UA: '+esc(r.user_agent)+'</div></div>'+
        '<div class="section admin-controls"><h3>개발자 처리</h3><div class="row"><select id="status-'+esc(r.id)+'"><option value="new" '+(r.status==="new"?"selected":"")+'>새 신고</option><option value="checking" '+(r.status==="checking"?"selected":"")+'>확인 중</option><option value="fixed" '+(r.status==="fixed"?"selected":"")+'>수정 완료</option><option value="closed" '+(r.status==="closed"?"selected":"")+'>종료</option></select><button class="btn" onclick="saveReport(\''+esc(r.id)+'\')">저장</button></div><textarea id="note-'+esc(r.id)+'" placeholder="개발자 메모">'+esc(r.dev_note||"")+'</textarea><div class="muted" id="save-'+esc(r.id)+'"></div></div>'+
      '</div></div></article>';
  }).join("");
}
async function saveReport(id){
  const e=$("#save-"+CSS.escape(id));e.textContent="저장 중…";
  const r=await getClient().from("bug_reports").update({status:$("#status-"+CSS.escape(id)).value,dev_note:$("#note-"+CSS.escape(id)).value}).eq("id",id);
  if(r.error){e.className="bad";e.textContent=r.error.message;return}
  e.className="good";e.textContent="저장됨";setTimeout(loadReports,500);
}
async function openAttachment(id,index){
  const r=reports.find(x=>x.id===id),a=r&&Array.isArray(r.attachment_paths)?r.attachment_paths[index]:null;
  if(!a||!a.path)return;
  const x=await getClient().storage.from(cfg.bucket||"bug-report-files").createSignedUrl(a.path,120);
  if(x.error){alert(x.error.message);return}
  window.open(x.data.signedUrl,"_blank","noopener");
}
async function boot(){
  if(!ready()){setLoginStatus("report-config.js에 Supabase 연결값이 비어 있습니다.","bad");return}
  const s=await getClient().auth.getSession();
  if(s.data?.session)await enterInbox();
}
$("#loginBtn").onclick=login;
$("#password").onkeydown=e=>{if(e.key==="Enter")login()};
$("#reloadBtn").onclick=loadReports;
$("#statusFilter").onchange=loadReports;
$("#logoutBtn").onclick=async()=>{await getClient().auth.signOut();location.reload()};
boot();
</script>
</body>
</html>
